openapi: 3.1.0
info:
  title: Clinical Interview API
  version: 0.1.0-draft
  description: >-
    Ephemeral API for the compiled Clinical Interview runtime. Clinical content
    is draft and unreviewed, is available only for limited testing or a
    clinician-supervised pilot, and must not be used as independent diagnostic
    or treatment advice.
servers:
  - url: http://127.0.0.1:8000
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Check process health
      responses:
        "200":
          description: Healthy process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/catalog:
    get:
      summary: Get the available interaction-purpose catalog
      responses:
        "200":
          description: Current service-mode catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sessions:
    post:
      summary: Create an ephemeral interaction session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode_selection:
                  type: string
                  maxLength: 10000
                  description: Optional conversational purpose selection
                initial_message:
                  type: string
                  maxLength: 10000
                  description: Optional first patient message
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read the current in-memory session state
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Close and purge a session without returning a result
      responses:
        "200":
          description: Session purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Submit one response and obtain the next runtime state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        "200":
          description: Updated session and next question or stop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{session_id}/result:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read the current structured clinician handoff result
      responses:
        "200":
          description: Draft structured handoff result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{session_id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Return the final result and immediately purge session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Result returned and response-bearing state purged
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status, response_state_purged, result]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  status:
                    const: completed
                  response_state_purged:
                    const: true
                  result:
                    $ref: "#/components/schemas/InterviewResult"
                  closure:
                    type: object
                    additionalProperties: true
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, service, api_version, execution_mode, response_storage]
      properties:
        status:
          const: ok
        service:
          const: clinical-interview-api
        api_version:
          const: v1
        execution_mode:
          enum: [research_test, clinician_supervised_pilot]
        response_storage:
          const: memory_only
        active_sessions:
          type: integer
          minimum: 0
    Session:
      type: object
      required: [session_id, status, created_at, expires_at, retention, state]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          const: active
        mode_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        retention:
          type: object
          required: [storage, ttl_seconds, delete_endpoint]
          properties:
            storage:
              const: memory_only
            ttl_seconds:
              type: integer
            delete_endpoint:
              type: string
        state:
          type: object
          additionalProperties: true
    InterviewResult:
      type: object
      required:
        - session_id
        - mode_id
        - lifecycle_status
        - review_status
        - clinical_use_status
        - independent_diagnosis_or_treatment
        - available_formats
        - fhir
      properties:
        session_id:
          type: string
          format: uuid
        mode_id:
          const: clinical_adaptive
        lifecycle_status:
          const: draft
        review_status:
          const: unreviewed
        clinical_use_status:
          const: limited
        independent_diagnosis_or_treatment:
          const: false
        available_formats:
          type: array
          items:
            type: string
        clinical_handoff:
          type: [object, "null"]
          additionalProperties: true
        fhir:
          type: object
          additionalProperties: true
    PurgeResult:
      type: object
      required: [session_id, status, response_state_purged]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          const: deleted
        response_state_purged:
          const: true
        closure:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Session not found or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Session state does not support this operation yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Temporary session capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
