openapi: 3.1.0
info:
  title: Clinical Interview API
  version: 0.2.0-draft
  description: >-
    Ephemeral API for the compiled Clinical Interview runtime. Clinical content
    is draft and unreviewed, is available only for limited testing or a
    clinician-supervised pilot, and must not be used as independent diagnostic
    or treatment advice.
servers:
  - url: http://127.0.0.1:8000
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Check process health
      responses:
        "200":
          description: Healthy process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /demo-api/config:
    get:
      security: []
      summary: Read the constrained anonymous demo configuration
      responses:
        "200":
          description: Anonymous demo policy and local provider metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /demo-api/terminology/status:
    get:
      security: []
      summary: Check the fixed terminology server used by the anonymous demo
      responses:
        "200":
          description: Safe terminology capability summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /demo-api/terminology/expand:
    post:
      security: []
      summary: Expand one ValueSet canonical on the fixed terminology server
      description: Only the canonical, optional filter, and count are transmitted; participant answers are never sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueSetExpansionRequest"
      responses:
        "200":
          description: Bounded ValueSet expansion
        "404":
          $ref: "#/components/responses/NotFound"
  /demo-api/resources:
    get:
      security: []
      summary: List response-free resources available to the anonymous demo
      responses:
        "200":
          description: Anonymous demo resource catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /demo-api/resources/{resource_id}:
    parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
    get:
      security: []
      summary: Read one allowlisted anonymous demo resource
      responses:
        "200":
          description: Allowlisted resource
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
  /demo-api/sessions:
    post:
      security: []
      summary: Start a short-lived synthetic anonymous demo session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode_selection:
                  type: string
                initial_message:
                  type: string
      responses:
        "201":
          description: Anonymous demo session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          description: Anonymous demo request limit reached
  /demo-api/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      security: []
      summary: Submit one synthetic response to an anonymous demo session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Updated anonymous demo session
  /demo-api/sessions/{session_id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      security: []
      summary: Return the draft result and purge anonymous response state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Anonymous demo completed and purged
  /demo-api/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      security: []
      summary: Purge an anonymous demo session without returning a result
      responses:
        "200":
          description: Anonymous demo session purged
  /v1/catalog:
    get:
      summary: Get the available interaction-purpose catalog
      responses:
        "200":
          description: Current service-mode catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/llm/providers:
    get:
      summary: List server-approved LLM providers and selection rules
      description: >-
        Returns public provider metadata only. Provider endpoints, secret names,
        and credentials are never returned.
      responses:
        "200":
          description: Governed LLM provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProviderCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/terminology/status:
    get:
      summary: Check the administrator-configured terminology server
      responses:
        "200":
          description: Safe terminology capability summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/terminology/expand:
    post:
      summary: Expand one ValueSet canonical on the fixed terminology server
      description: This proxy cannot fetch a caller-supplied server URL and never receives participant answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueSetExpansionRequest"
      responses:
        "200":
          description: Bounded ValueSet expansion
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/demo/resources:
    get:
      summary: List allowlisted demo questionnaire resources
      description: Returns metadata only and never contains participant responses.
      responses:
        "200":
          description: Demo resource catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/demo/resources/{resource_id}:
    parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          enum:
            - patient-experience-5th-2025
            - national-health-screening-form-1-2025
            - national-health-screening-form-2-2025
    get:
      summary: Read one allowlisted demo questionnaire resource
      responses:
        "200":
          description: Repository-owned questionnaire or knowledge resource
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions:
    post:
      summary: Create an ephemeral interaction session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode_selection:
                  type: string
                  maxLength: 10000
                  description: Optional conversational purpose selection
                initial_message:
                  type: string
                  maxLength: 10000
                  description: Optional first patient message
                llm_policy:
                  $ref: "#/components/schemas/LlmPolicy"
                llm_selection:
                  $ref: "#/components/schemas/LlmSelectionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read the current in-memory session state
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Close and purge a session without returning a result
      responses:
        "200":
          description: Session purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Submit one response and obtain the next runtime state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        "200":
          description: Updated session and next question or stop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{session_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: X-Clinical-Filename
        in: header
        required: true
        description: UTF-8 filename encoded with encodeURIComponent/RFC 3986 percent encoding
        schema:
          type: string
          maxLength: 540
    post:
      summary: Attach one ephemeral health or clinical document to a screening recommendation session
      description: The original bytes remain in session memory, are never sent to an LLM, and are purged on completion, deletion, or expiry. Textual formats are extracted locally; scans, images, PDF, DOCX, and DICOM are accepted with extraction pending.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema: {type: string, format: binary, maxLength: 5242880}
          application/json:
            schema: {type: string, format: binary, maxLength: 5242880}
          application/pdf:
            schema: {type: string, format: binary, maxLength: 5242880}
          application/dicom:
            schema: {type: string, format: binary, maxLength: 5242880}
          image/jpeg:
            schema: {type: string, format: binary, maxLength: 5242880}
          image/png:
            schema: {type: string, format: binary, maxLength: 5242880}
          image/webp:
            schema: {type: string, format: binary, maxLength: 5242880}
          text/plain:
            schema: {type: string, format: binary, maxLength: 5242880}
          text/csv:
            schema: {type: string, format: binary, maxLength: 5242880}
      responses:
        "201":
          description: Clinical material accepted into ephemeral session memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalMaterialUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Per-file, file-count, or total-session upload limit exceeded
        "415":
          description: Unsupported clinical material content type
  /v1/sessions/{session_id}/result:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read the current structured clinician handoff result
      responses:
        "200":
          description: Draft structured handoff result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{session_id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Return the final result and immediately purge session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Result returned and response-bearing state purged
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status, response_state_purged, result]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  status:
                    const: completed
                  response_state_purged:
                    const: true
                  result:
                    $ref: "#/components/schemas/InterviewResult"
                  closure:
                    type: object
                    additionalProperties: true
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ClinicalMaterialManifest:
      type: object
      required: [filename, content_type, size_bytes, extraction_status, storage, patient_data_transmitted_to_llm]
      properties:
        filename: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer, minimum: 1, maximum: 5242880}
        extraction_status:
          type: string
          enum: [text_extracted_locally, text_decode_failed, accepted_pending_extraction]
        storage: {const: memory_only}
        patient_data_transmitted_to_llm: {const: false}
    ClinicalMaterialUploadResult:
      type: object
      required: [session_id, status, material, uploaded_material_count, response_storage, patient_data_transmitted_to_llm]
      properties:
        session_id: {type: string, format: uuid}
        status: {const: accepted}
        material: {$ref: "#/components/schemas/ClinicalMaterialManifest"}
        uploaded_material_count: {type: integer, minimum: 1, maximum: 5}
        response_storage: {const: memory_only}
        patient_data_transmitted_to_llm: {const: false}
    ValueSetExpansionRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 512
          description: ValueSet canonical URL, optionally including a canonical version suffix.
        filter:
          type: string
          maxLength: 200
        count:
          type: integer
          minimum: 1
          maximum: 100
    Health:
      type: object
      required: [status, service, api_version, execution_mode, response_storage]
      properties:
        status:
          const: ok
        service:
          const: clinical-interview-api
        api_version:
          const: v1
        execution_mode:
          enum: [research_test, clinician_supervised_pilot]
        response_storage:
          const: memory_only
        active_sessions:
          type: integer
          minimum: 0
    Session:
      type: object
      required:
        - session_id
        - status
        - created_at
        - expires_at
        - retention
        - llm
        - presentation
        - state
      properties:
        session_id:
          type: string
          format: uuid
        status:
          const: active
        mode_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        retention:
          type: object
          required: [storage, ttl_seconds, delete_endpoint]
          properties:
            storage:
              const: memory_only
            ttl_seconds:
              type: integer
            delete_endpoint:
              type: string
        llm:
          $ref: "#/components/schemas/LlmSelection"
        presentation:
          $ref: "#/components/schemas/LlmPresentation"
        state:
          type: object
          additionalProperties: true
    InterviewResult:
      type: object
      required:
        - session_id
        - mode_id
        - lifecycle_status
        - review_status
        - clinical_use_status
        - independent_diagnosis_or_treatment
        - llm
        - available_formats
      properties:
        session_id:
          type: string
          format: uuid
        mode_id:
          enum: [clinical_adaptive, health_information]
        lifecycle_status:
          const: draft
        review_status:
          const: unreviewed
        clinical_use_status:
          const: limited
        independent_diagnosis_or_treatment:
          const: false
        llm:
          $ref: "#/components/schemas/LlmSelection"
        available_formats:
          type: array
          items:
            type: string
        clinical_handoff:
          type: [object, "null"]
          additionalProperties: true
        informational_answer:
          type: object
          additionalProperties: true
        consultation:
          type: object
          additionalProperties: true
        response_storage:
          const: memory_only
        fhir:
          type: object
          additionalProperties: true
    LlmPolicy:
      type: object
      additionalProperties: false
      description: Requester-defined allowlist for this interaction.
      properties:
        allowed_provider_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        default_provider_id:
          type: string
        participant_may_choose:
          type: boolean
          default: true
    LlmSelectionRequest:
      type: object
      additionalProperties: false
      description: >-
        Provider choice only. Credentials, endpoint URLs, and arbitrary model
        identifiers are prohibited in the request body.
      properties:
        provider_id:
          type: string
        selected_by:
          enum: [platform_default, requester, participant]
        external_processing_consent:
          type: boolean
          default: false
    LlmSelection:
      type: object
      required:
        - provider_id
        - model
        - selected_by
        - processing_location
        - external_processing
        - runtime_role
        - clinical_authority
      properties:
        provider_id:
          type: string
        display_name:
          type: string
        model:
          type: string
        selected_by:
          enum: [platform_default, requester, participant]
        processing_location:
          enum: [banttas_ai_local, external_vendor]
        external_processing:
          type: boolean
        external_processing_consent:
          type: boolean
        allowed_provider_ids:
          type: array
          items:
            type: string
        participant_may_choose:
          type: boolean
        runtime_role:
          const: custom_gpt_conversation_or_health_information
        presentation_enabled:
          type: boolean
        clinical_authority:
          const: false
    LlmPresentation:
      type: object
      required:
        - status
        - purpose
        - provider_id
        - clinical_authority
      properties:
        status:
          enum: [generated, deterministic_fallback, not_applicable]
        purpose:
          enum: [custom_gpt_conversation_turn, question_presentation_only, health_information]
        provider_id:
          type: string
        model:
          type: string
        text:
          type: string
        reason:
          type: string
        cached:
          type: boolean
        patient_response_transmitted:
          const: false
        patient_input_transmitted:
          type: boolean
          description: True only for the dedicated health-information advisor after provider policy and consent checks.
        processing_location:
          enum: [banttas_ai_local, external_vendor]
        independent_diagnosis_or_treatment:
          const: false
        safety_status:
          type: object
          additionalProperties: true
        clinical_authority:
          const: false
    LlmProviderCatalog:
      type: object
      required:
        - default_provider_id
        - selection_scope
        - external_processing_requires_explicit_consent
        - runtime_role
        - providers
      properties:
        default_provider_id:
          type: string
        selection_scope:
          const: server_configured_allowlist
        participant_selection_supported:
          type: boolean
        requester_policy_supported:
          type: boolean
        credentials_in_request_body:
          const: prohibited
        external_processing_requires_explicit_consent:
          const: true
        runtime_role:
          const: custom_gpt_conversation_or_health_information
        presentation_enabled:
          type: boolean
        adaptive_interview:
          enum:
            - compiled_candidate_window
            - inline_linked_index
            - action_two_stage_exact_objects
        legacy_deterministic_question_fallback:
          const: false
        providers:
          type: array
          items:
            type: object
            additionalProperties: true
    PurgeResult:
      type: object
      required: [session_id, status, response_state_purged]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          const: deleted
        response_state_purged:
          const: true
        closure:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Session not found or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Session state does not support this operation yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Temporary session capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
