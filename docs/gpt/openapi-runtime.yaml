openapi: 3.1.0
info:
  title: Clinical Interview Runtime Knowledge
  version: 1.50.1
  description: Read-only runtime Knowledge, Fact, and isolated test-catalog resources. No patient answers are accepted.
servers:
  - url: https://ggojang.github.io/clinical-interview-platform
paths:
  /gpt/manifest.json:
    get:
      operationId: getManifest
      summary: Get the current knowledge manifest and resource digests
      responses:
        '200':
          description: Knowledge manifest
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/service-modes.json:
    get:
      operationId: getInteractionServiceModes
      summary: Get the purpose-first core service modes and routing contract
      responses:
        '200':
          description: Draft core service-mode catalog without patient responses
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/reason-for-encounters.json:
    get:
      operationId: getReasonForEncounters
      summary: Get the Reason for Encounter catalog, aliases, and implementation status
      responses:
        '200':
          description: Reason for Encounter catalog
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/common-facts.json:
    get:
      operationId: getCommonInterviewFacts
      summary: Get compact shared Facts including additional-comment handling
      responses:
        '200':
          description: Common interview Fact collection
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/rfe/{rfeId}/facts.json:
    get:
      operationId: getReasonForEncounterFacts
      summary: Get compact Facts for one implemented Reason for Encounter
      parameters:
        - name: rfeId
          in: path
          required: true
          description: Implemented Reason for Encounter identifier returned by getReasonForEncounters; never invent one
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
            enum: [abdominal_pain, allergy_concern, anemia_concern_follow_up, asthma_copd_follow_up, back_pain, bowel_symptoms, breast_symptoms, chest_pain, cough, diabetes_follow_up, dizziness_syncope, dyspnea, dyspepsia_reflux, ear_hearing_symptoms, edema, epistaxis, eye_symptoms, fatigue, fever, focal_weakness_numbness, gait_falls_concern, headache, hypertension_follow_up, joint_limb_complaint, kidney_function_ckd_follow_up, liver_function_chronic_follow_up, lump_lymph_node, medication_review, memory_cognitive_concern, menstrual_uterine_bleeding, mental_health_sleep, neck_pain, oral_dental_symptoms, palpitations, pediatric_growth_development, pregnancy_postpartum_concern, reproductive_genital_symptoms, seizure_event_follow_up, skin_complaint, test_result_follow_up, thyroid_concern_follow_up, tremor_movement_concern, upper_respiratory_symptoms, urinary_symptoms, vomiting_diarrhea, weight_constitutional_change, wound_minor_injury]
      responses:
        '200':
          description: Reason for Encounter Fact collection
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/rfe/{rfeId}/questions.json:
    get:
      operationId: getReasonForEncounterQuestions
      summary: Get compact questions for one implemented Reason for Encounter
      parameters:
        - name: rfeId
          in: path
          required: true
          description: Implemented Reason for Encounter identifier returned by getReasonForEncounters; never invent one
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
            enum: [abdominal_pain, allergy_concern, anemia_concern_follow_up, asthma_copd_follow_up, back_pain, bowel_symptoms, breast_symptoms, chest_pain, cough, diabetes_follow_up, dizziness_syncope, dyspnea, dyspepsia_reflux, ear_hearing_symptoms, edema, epistaxis, eye_symptoms, fatigue, fever, focal_weakness_numbness, gait_falls_concern, headache, hypertension_follow_up, joint_limb_complaint, kidney_function_ckd_follow_up, liver_function_chronic_follow_up, lump_lymph_node, medication_review, memory_cognitive_concern, menstrual_uterine_bleeding, mental_health_sleep, neck_pain, oral_dental_symptoms, palpitations, pediatric_growth_development, pregnancy_postpartum_concern, reproductive_genital_symptoms, seizure_event_follow_up, skin_complaint, test_result_follow_up, thyroid_concern_follow_up, tremor_movement_concern, upper_respiratory_symptoms, urinary_symptoms, vomiting_diarrhea, weight_constitutional_change, wound_minor_injury]
      responses:
        '200':
          description: Reason for Encounter question collection
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/rfe/{rfeId}/rules.json:
    get:
      operationId: getReasonForEncounterRules
      summary: Get compact safety and routing rules for one implemented Reason for Encounter
      parameters:
        - name: rfeId
          in: path
          required: true
          description: Implemented Reason for Encounter identifier returned by getReasonForEncounters; never invent one
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
            enum: [abdominal_pain, allergy_concern, anemia_concern_follow_up, asthma_copd_follow_up, back_pain, bowel_symptoms, breast_symptoms, chest_pain, cough, diabetes_follow_up, dizziness_syncope, dyspnea, dyspepsia_reflux, ear_hearing_symptoms, edema, epistaxis, eye_symptoms, fatigue, fever, focal_weakness_numbness, gait_falls_concern, headache, hypertension_follow_up, joint_limb_complaint, kidney_function_ckd_follow_up, liver_function_chronic_follow_up, lump_lymph_node, medication_review, memory_cognitive_concern, menstrual_uterine_bleeding, mental_health_sleep, neck_pain, oral_dental_symptoms, palpitations, pediatric_growth_development, pregnancy_postpartum_concern, reproductive_genital_symptoms, seizure_event_follow_up, skin_complaint, test_result_follow_up, thyroid_concern_follow_up, tremor_movement_concern, upper_respiratory_symptoms, urinary_symptoms, vomiting_diarrhea, weight_constitutional_change, wound_minor_injury]
      responses:
        '200':
          description: Reason for Encounter rule collection
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/rfe/{rfeId}/rules/{ruleType}.json:
    get:
      operationId: getReasonForEncounterRulePartition
      summary: Get one declared compact rule partition after loading the RFE rule index
      parameters:
        - name: rfeId
          in: path
          required: true
          description: Implemented Reason for Encounter identifier returned by getReasonForEncounters; never invent one
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
            enum: [abdominal_pain, allergy_concern, anemia_concern_follow_up, asthma_copd_follow_up, back_pain, bowel_symptoms, breast_symptoms, chest_pain, cough, diabetes_follow_up, dizziness_syncope, dyspnea, dyspepsia_reflux, ear_hearing_symptoms, edema, epistaxis, eye_symptoms, fatigue, fever, focal_weakness_numbness, gait_falls_concern, headache, hypertension_follow_up, joint_limb_complaint, kidney_function_ckd_follow_up, liver_function_chronic_follow_up, lump_lymph_node, medication_review, memory_cognitive_concern, menstrual_uterine_bleeding, mental_health_sleep, neck_pain, oral_dental_symptoms, palpitations, pediatric_growth_development, pregnancy_postpartum_concern, reproductive_genital_symptoms, seizure_event_follow_up, skin_complaint, test_result_follow_up, thyroid_concern_follow_up, tremor_movement_concern, upper_respiratory_symptoms, urinary_symptoms, vomiting_diarrhea, weight_constitutional_change, wound_minor_injury]
        - name: ruleType
          in: path
          required: true
          description: Partition declared by the RFE rules index; do not guess an undeclared partition
          schema:
            type: string
            enum: [completion, priority]
      responses:
        '200':
          description: Reason for Encounter rule partition
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/screening-kr.json:
    get:
      operationId: getScreeningKnowledge
      summary: Get Korean screening knowledge only after preventive care is the Reason for Encounter
      responses:
        '200':
          description: Korean screening knowledge
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/test-catalogs/health-screening-packages/registry.json:
    get:
      operationId: getHealthScreeningPackageCatalogRegistry
      summary: Get the active version pointer for the isolated test health-screening package catalog
      responses:
        '200':
          description: Test-only catalog registry without patient responses
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/test-catalogs/health-screening-packages/versions/{catalogVersion}/metadata.json:
    get:
      operationId: getHealthScreeningPackageCatalogMetadata
      summary: Get versioned catalog metadata and the public region list
      parameters:
        - name: catalogVersion
          in: path
          required: true
          description: Version returned by the catalog registry; never derive it from a user answer
          schema:
            type: string
            pattern: '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$'
      responses:
        '200':
          description: Versioned test-catalog metadata without patient responses
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/test-catalogs/health-screening-packages/versions/{catalogVersion}/regions/{regionId}/index.json:
    get:
      operationId: getHealthScreeningPackageRegionMetadata
      summary: Get page references for one public catalog region; never send health answers as parameters
      parameters:
        - name: catalogVersion
          in: path
          required: true
          description: Version returned by the catalog registry; never derive it from a user answer
          schema:
            type: string
            pattern: '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$'
        - name: regionId
          in: path
          required: true
          description: Public region identifier selected from catalog metadata; do not send clinical facts with it
          schema:
            type: string
            enum: [seoul, gyeonggi, incheon, busan, daegu, gwangju, daejeon, ulsan, sejong, gangwon, chungbuk, chungnam, jeonbuk, jeonnam, gyeongbuk, gyeongnam, jeju]
      responses:
        '200':
          description: Region page metadata for the test catalog
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/test-catalogs/health-screening-packages/versions/{catalogVersion}/regions/{regionId}/pages/{page}.json:
    get:
      operationId: getHealthScreeningPackageRegionPage
      summary: Get one price-sorted public package summary page for local candidate comparison
      parameters:
        - name: catalogVersion
          in: path
          required: true
          description: Version returned by the catalog registry; never derive it from a user answer
          schema:
            type: string
            pattern: '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$'
        - name: regionId
          in: path
          required: true
          description: Public region identifier selected from catalog metadata; do not send clinical facts with it
          schema:
            type: string
            enum: [seoul, gyeonggi, incheon, busan, daegu, gwangju, daejeon, ulsan, sejong, gangwon, chungbuk, chungnam, jeonbuk, jeonnam, gyeongbuk, gyeongnam, jeju]
        - name: page
          in: path
          required: true
          description: Page number returned by the region metadata operation
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: At most 50 public package summaries; no patient data is accepted
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/test-catalogs/health-screening-packages/versions/{catalogVersion}/packages/{packageId}.json:
    get:
      operationId: getHealthScreeningPackageDetail
      summary: Get the source-preserving detail for one package identifier returned by a region page
      parameters:
        - name: catalogVersion
          in: path
          required: true
          description: Version returned by the catalog registry; never derive it from a user answer
          schema:
            type: string
            pattern: '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$'
        - name: packageId
          in: path
          required: true
          description: Opaque package identifier returned by a region page; never invent one
          schema:
            type: string
            pattern: '^pkg-[0-9a-f]{16}$'
      responses:
        '200':
          description: Test-only package detail with source URL and listing variants
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/hira-adequacy-assessments.json:
    get:
      operationId: getHiraAdequacyAssessmentInterviews
      summary: Resolve HIRA assessment or fixed-questionnaire entry aliases and get source-aware interview definitions
      responses:
        '200':
          description: Research-only registry separating patient or proxy questions, fixed questionnaires, and clinician observation, test, record, or claim fields
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/assessments/{programId}.json:
    get:
      operationId: getHiraAdequacyAssessmentInterviewProgram
      summary: Prefetch one explicitly selected patient-writable HIRA assessment program before asking its start confirmation; do not display items until confirmed
      parameters:
        - name: programId
          in: path
          required: true
          description: Program identifier returned by the HIRA assessment entry catalog after explicit selection; this read-only prefetch sends no patient data
          schema:
            type: string
            enum: [hira.long_term_care_hospital_inpatient.2026-cycle2-8, hira.depression_outpatient, hira.rheumatoid_arthritis, hira.inpatient_patient_experience.5th-2025, hira.acute_stroke_event_history, hira.medical_aid_psychiatry_patient_experience, hira.mental_health_inpatient_patient_experience, hira.anesthesia_patient_assessment, hira.imaging_pre_examination_assessment, hira.dementia_patient_proxy_assessment]
      responses:
        '200':
          description: One compact research-only program containing its patient or proxy question groups, result-capture items, or fixed-questionnaire reference
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/questionnaires/patient-experience-5th-2025/metadata.json:
    get:
      operationId: getPatientExperienceQuestionnaire
      summary: Load the patient-experience activation gate; ask its required confirmation question before loading any section
      responses:
        '200':
          description: Metadata whose activation_gate requires asking whether the user wants to complete the survey; do not load a section until the user answers affirmatively
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/questionnaires/patient-experience-5th-2025/sections/{sectionId}.json:
    get:
      operationId: getPatientExperienceQuestionnaireSection
      summary: Load one patient-experience Questionnaire section only after affirmative activation confirmation
      parameters:
        - name: sectionId
          in: path
          required: true
          description: Source questionnaire section number
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6, 7, 8]
      responses:
        '200':
          description: One compact Questionnaire section without patient responses; if activation is not confirmed, do not present its items and ask the required activation question
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /gpt/terminology-source.json:
    get:
      operationId: getTerminologySource
      summary: Get STOM source identity, verified operations, cadence, and limitations
      responses:
        '200':
          description: Terminology source manifest
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
